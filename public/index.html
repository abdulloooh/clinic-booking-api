<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinic bookings</title>
    <link rel="stylesheet" href="/assets/styles.css?v=3" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Clinic desk</p>
        <h1>Book an appointment</h1>
        <p class="lede">Pick an open slot, leave your details, and get a booking id back.</p>
      </header>

      <section class="panel">
        <div class="row">
          <label>
            Provider filter
            <select id="provider">
              <option value="">All providers</option>
            </select>
          </label>
          <button type="button" id="refresh" class="secondary">Refresh slots</button>
        </div>

        <div id="slots" class="slots" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Your details</h2>
        <form id="book-form">
          <input type="hidden" id="slot_id" name="slot_id" />
          <label>
            Name
            <input id="name" name="name" required placeholder="Ada Obi" autocomplete="name" />
          </label>
          <label>
            Email
            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="ada@example.com"
              autocomplete="email"
            />
          </label>
          <button type="submit" id="book-btn" disabled>Book selected slot</button>
        </form>
        <p id="selected" class="muted">No slot selected yet.</p>
      </section>

      <section class="panel" id="confirmation" hidden>
        <h2>Confirmation</h2>
        <pre id="confirmation-body"></pre>
        <div class="row">
          <button type="button" id="cancel-btn" class="secondary">Cancel this booking</button>
          <button type="button" id="retry-btn" class="secondary" hidden>
            Retry last request (idempotency)
          </button>
        </div>
      </section>

      <section class="panel">
        <h2>My bookings</h2>
        <p class="muted">Look up by email and page through results (level 4).</p>
        <form id="lookup-form" class="row">
          <label>
            Email
            <input
              id="lookup-email"
              name="lookup-email"
              type="email"
              required
              placeholder="ada@example.com"
              autocomplete="email"
            />
          </label>
          <button type="submit" id="lookup-btn" class="secondary">Load bookings</button>
        </form>
        <div id="bookings" class="slots" aria-live="polite"></div>
        <div class="row" id="bookings-pager" hidden>
          <button type="button" id="next-page" class="secondary">Next page</button>
          <p id="bookings-meta" class="muted"></p>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="/assets/app.js?v=3" type="module"></script>
  </body>
</html>
